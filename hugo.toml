baseURL = "https://jannettw.com"
title = "Jannett Wehle"
theme = "hugo-PaperMod"
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
pygmentsUseClasses = true
pluralizelisttitles = false

[minify]
disableXML = true
minifyOutput = true

[params]
env = "production"
title = "Jannett Wehle"
description = "Portfolio of Jannett Wehle, electrical engineer and PCB designer creating power electronics, embedded systems, and practical hardware projects."
keywords = [ "Portfolio" ]
author = "Jannett Wehle"
images = [ "/jannett.jpg" ]
DateFormat = "January 2, 2006"
defaultTheme = "dark"
disableThemeToggle = true
ShowReadingTime = false
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = false
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
comments = false
hidemeta = false
hideSummary = false
showtoc = false
tocopen = false

  [params.assets]
  disableFingerprinting = true
  favicon = "/favicon.ico"
  favicon16x16 = "/favicon-16x16.png"
  favicon32x32 = "/favicon-32x32.png"
  apple_touch_icon = "/apple-touch-icon.png"
  safari_pinned_tab = "/safari-pinned-tab.svg"

  [params.label]
  text = "Home"

  [params.profileMode]
  enabled = true
  title = "Jannett Wehle"
  subtitle = """
Electrical Engineer | PCB Designer | Creative Writer
"""
  imageURL = "/jannett.jpg"

  [[params.socialIcons]]
  name = "github"
  url = "https://github.com/jwehle"

  [[params.socialIcons]]
  name = "youtube"
  url = "https://www.youtube.com/@jannettw"

  [[params.socialIcons]]
  name = "linkedin"
  url = "https://www.linkedin.com/in/jannett-wehle-49b867104"

  [[params.socialIcons]]
  name = "email"
  url = "mailto:jannett@jannettw.com"

  [params.cover]
  hidden = true
  hiddenInList = true
  hiddenInSingle = true

  [params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  location = 0
  distance = 1_000
  threshold = 0.4
  minMatchCharLength = 0
  keys = [ "title", "permalink", "summary", "content" ]

