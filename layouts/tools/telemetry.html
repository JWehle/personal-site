{{ define "main" }}
<article class="post-single">
  <header class="post-header">
    {{ partial "breadcrumbs.html" . }}
    <h1 class="post-title entry-hint-parent">{{ .Title }}</h1>
    {{ if .Description }}
    <div class="post-description">{{ .Description }}</div>
    {{ end }}
  </header>

  <div class="post-content">
    <div id="telemetry-controls" style="display:flex;flex-wrap:wrap;gap:0.75rem;align-items:center;justify-content:space-between;margin-bottom:1.25rem;">
      <div style="display:flex;gap:0.4rem;flex-wrap:wrap;" id="range-buttons">
        <button type="button" data-hours="6" class="telemetry-btn active">6h</button>
        <button type="button" data-hours="24" class="telemetry-btn">24h</button>
        <button type="button" data-hours="168" class="telemetry-btn">7d</button>
        <button type="button" data-hours="720" class="telemetry-btn">30d</button>
        <button type="button" data-hours="8760" class="telemetry-btn">1y</button>
      </div>
      <div style="display:flex;gap:0.75rem;align-items:center;font-size:0.9rem;">
        <button type="button" id="unit-toggle" class="telemetry-btn">Show °C</button>
        <span id="telemetry-status">Loading...</span>
      </div>
    </div>

    <div id="telemetry-cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0.85rem;margin-bottom:1.5rem;">
      <div class="telemetry-card">
        <div class="telemetry-label">Temperature</div>
        <div class="telemetry-value" id="latest-temp">--</div>
      </div>
      <div class="telemetry-card">
        <div class="telemetry-label">Relative Humidity</div>
        <div class="telemetry-value" id="latest-humidity">--</div>
      </div>
      <div class="telemetry-card">
        <div class="telemetry-label">Wi-Fi RSSI</div>
        <div class="telemetry-value" id="latest-rssi">--</div>
      </div>
      <div class="telemetry-card">
        <div class="telemetry-label">Last Reading</div>
        <div class="telemetry-value telemetry-sub" id="latest-time">--</div>
      </div>
    </div>

    <div class="telemetry-chart-box">
      <h3>Temperature Trend</h3>
      <canvas id="tempChart" height="110"></canvas>
    </div>

    <div class="telemetry-chart-box" style="margin-top:1.5rem;">
      <h3>Humidity Trend</h3>
      <canvas id="humidityChart" height="110"></canvas>
    </div>
  </div>
</article>

<style>
  .telemetry-card {
    border: 1px solid var(--border);
    background: var(--entry);
    border-radius: 10px;
    padding: 0.9rem 1rem;
  }
  .telemetry-label {
    font-size: 0.8rem;
    opacity: 0.75;
    margin-bottom: 0.25rem;
  }
  .telemetry-value {
    font-size: 1.5rem;
    font-weight: 700;
  }
  .telemetry-sub {
    font-size: 0.95rem;
    font-weight: 600;
  }
  .telemetry-chart-box {
    border: 1px solid var(--border);
    background: var(--entry);
    border-radius: 10px;
    padding: 1rem;
  }
  .telemetry-chart-box h3 {
    margin-top: 0;
    margin-bottom: 0.75rem;
    font-size: 1rem;
  }
  .telemetry-btn {
    border: 1px solid var(--border);
    background: var(--entry);
    color: var(--primary);
    border-radius: 6px;
    padding: 0.35rem 0.7rem;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .telemetry-btn.active {
    background: var(--primary);
    color: var(--theme);
    border-color: var(--primary);
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
(() => {
  const API_BASE = "https://jannettw.com/api/readings";
  let currentHours = 6;
  let useFahrenheit = true;
  let latestReadings = [];
  let tempChart = null;
  let humidityChart = null;

  const statusEl = document.getElementById("telemetry-status");
  const tempEl = document.getElementById("latest-temp");
  const humEl = document.getElementById("latest-humidity");
  const rssiEl = document.getElementById("latest-rssi");
  const timeEl = document.getElementById("latest-time");
  const unitBtn = document.getElementById("unit-toggle");

  function cToF(c) {
    return (c * 9) / 5 + 32;
  }

  function formatTemp(c) {
    if (typeof c !== "number") return "--";
    return useFahrenheit ? `${cToF(c).toFixed(1)} °F` : `${c.toFixed(2)} °C`;
  }

  function downsample(rows, maxPoints = 600) {
    if (rows.length <= maxPoints) return rows;
    const step = Math.ceil(rows.length / maxPoints);
    const sampled = [];
    for (let i = 0; i < rows.length; i += step) {
      const slice = rows.slice(i, i + step);
      const avgTs = Math.round(slice.reduce((a, b) => a + b.ts, 0) / slice.length);
      const avgTemp = slice.reduce((a, b) => a + b.temp_c, 0) / slice.length;
      const avgHum = slice.reduce((a, b) => a + b.humidity, 0) / slice.length;
      sampled.push({
        ts: avgTs,
        temp_c: avgTemp,
        humidity: avgHum,
        rssi: slice[slice.length - 1].rssi,
      });
    }
    return sampled;
  }

  function formatXAxisTick(ts, hours) {
    const d = new Date(ts * 1000);
    if (hours <= 24) {
      return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }
    if (hours <= 168) {
      return d.toLocaleDateString([], {
        weekday: "short",
        month: "short",
        day: "numeric",
      });
    }
    if (hours <= 720) {
      return d.toLocaleDateString([], { month: "short", day: "numeric" });
    }
    return d.toLocaleDateString([], {
      month: "short",
      day: "numeric",
      year: "numeric",
    });
  }

  function formatTooltipTimestamp(ts) {
    return new Date(ts * 1000).toLocaleString([], {
      month: "short",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit",
    });
  }

  function formatDateRange(rows) {
    const first = new Date(rows[0].ts * 1000);
    const last = new Date(rows[rows.length - 1].ts * 1000);
    const dateOptions = { weekday: "short", month: "short", day: "numeric" };
    const firstLabel = first.toLocaleDateString([], dateOptions);
    const lastLabel = last.toLocaleDateString([], dateOptions);
    const sameDay =
      first.getFullYear() === last.getFullYear() &&
      first.getMonth() === last.getMonth() &&
      first.getDate() === last.getDate();

    if (sameDay) {
      return `${firstLabel}, ${first.getFullYear()}`;
    }
    if (first.getFullYear() !== last.getFullYear()) {
      return `${firstLabel}, ${first.getFullYear()} – ${lastLabel}, ${last.getFullYear()}`;
    }
    return `${firstLabel} – ${lastLabel}, ${last.getFullYear()}`;
  }

  function xAxisOptions(plotted) {
    const showDateTitle = currentHours <= 24;
    return {
      ticks: { maxTicksLimit: 8 },
      title: {
        display: showDateTitle,
        text: showDateTitle ? formatDateRange(plotted) : "",
        padding: { top: 8 },
      },
    };
  }

  function chartPlugins(plotted) {
    return {
      legend: { display: false },
      tooltip: {
        callbacks: {
          title(items) {
            return formatTooltipTimestamp(plotted[items[0].dataIndex].ts);
          },
        },
      },
    };
  }

  function renderChartsAndCards() {
    if (!latestReadings.length) {
      tempEl.textContent = "--";
      humEl.textContent = "--";
      rssiEl.textContent = "--";
      timeEl.textContent = "No data in range";
      return;
    }

    const latest = latestReadings[latestReadings.length - 1];
    tempEl.textContent = formatTemp(latest.temp_c);
    humEl.textContent = `${latest.humidity.toFixed(1)}%`;
    rssiEl.textContent = typeof latest.rssi === "number" ? `${latest.rssi} dBm` : "--";
    timeEl.textContent = new Date(latest.ts * 1000).toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
    });

    const plotted = downsample(latestReadings, 600);
    const labels = plotted.map((r) => formatXAxisTick(r.ts, currentHours));
    const temps = plotted.map((r) =>
      Number((useFahrenheit ? cToF(r.temp_c) : r.temp_c).toFixed(2))
    );
    const hums = plotted.map((r) => Number(r.humidity.toFixed(2)));

    const tempCtx = document.getElementById("tempChart").getContext("2d");
    const humCtx = document.getElementById("humidityChart").getContext("2d");

    if (tempChart) tempChart.destroy();
    if (humidityChart) humidityChart.destroy();

    tempChart = new Chart(tempCtx, {
      type: "line",
      data: {
        labels,
        datasets: [
          {
            label: useFahrenheit ? "Temperature (°F)" : "Temperature (°C)",
            data: temps,
            borderWidth: 2,
            pointRadius: plotted.length > 120 ? 0 : 2,
            tension: 0.25,
          },
        ],
      },
      options: {
        responsive: true,
        animation: false,
        plugins: chartPlugins(plotted),
        scales: { x: xAxisOptions(plotted) },
      },
    });

    humidityChart = new Chart(humCtx, {
      type: "line",
      data: {
        labels,
        datasets: [
          {
            label: "Humidity (% RH)",
            data: hums,
            borderWidth: 2,
            pointRadius: plotted.length > 120 ? 0 : 2,
            tension: 0.25,
          },
        ],
      },
      options: {
        responsive: true,
        animation: false,
        plugins: chartPlugins(plotted),
        scales: { x: xAxisOptions(plotted) },
      },
    });
  }

  async function loadReadings(hours) {
    currentHours = hours;
    statusEl.textContent = "Updating...";
    try {
      const res = await fetch(`${API_BASE}?hours=${hours}`, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      latestReadings = Array.isArray(data.readings) ? data.readings : [];
      renderChartsAndCards();
      statusEl.textContent = `Live • ${latestReadings.length} pts`;
    } catch (err) {
      statusEl.textContent = `Fetch error: ${err.message}`;
    }
  }

  document.querySelectorAll("#range-buttons button").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#range-buttons button").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      loadReadings(Number(btn.dataset.hours));
    });
  });

  unitBtn.addEventListener("click", () => {
    useFahrenheit = !useFahrenheit;
    unitBtn.textContent = useFahrenheit ? "Show °C" : "Show °F";
    renderChartsAndCards();
  });

  loadReadings(currentHours);
  setInterval(() => loadReadings(currentHours), 60000);
})();
</script>
{{ end }}
